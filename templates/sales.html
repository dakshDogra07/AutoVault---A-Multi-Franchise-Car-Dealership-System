<!DOCTYPE html>
<html>
<head>
    <title>Sales - AutoVault</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 30px; }
        h1 { color: #e94560; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #16213e; text-align: left; }
        th { background: #e94560; }
        tr:hover { background: #16213e; }
        .form-box { background: #16213e; padding: 20px; border-radius: 10px; margin-top: 30px; }
        select { padding: 8px; margin: 5px; border-radius: 5px; border: none; width: 200px; }
        button { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <h1>💰 Sales</h1>
    <a href="/dashboard">← Back</a>

    <table>
        <tr>
            <th>ID</th><th>Car</th><th>Customer</th><th>Price</th><th>Date</th>
        </tr>
        {% for s in sales %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.brand }} {{ s.model }}</td>
            <td>{{ s.name }}</td>
            <td>₹{{ s.price }}</td>
            <td>{{ s.sale_date }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="form-box">
        <h3>Sell a Car</h3>
        <form action="/sell_car/{{ franchise_id }}" method="POST">
            <select name="car_id" required>
                <option value="">Select Car</option>
                {% for car in available_cars %}
                <option value="{{ car.id }}">{{ car.brand }} {{ car.model }} - ₹{{ car.price }}</option>
                {% endfor %}
            </select>
            <select name="customer_id" required>
                <option value="">Select Customer</option>
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
            <br><br>
            <button type="submit">Sell Car</button>
        </form>
    </div>
</body>
</html>
