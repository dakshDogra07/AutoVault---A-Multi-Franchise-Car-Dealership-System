<!DOCTYPE html>
<html>
<head>
    <title>Customers - AutoVault</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 30px; }
        h1 { color: #e94560; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #16213e; text-align: left; }
        th { background: #e94560; }
        tr:hover { background: #16213e; }
        .form-box { background: #16213e; padding: 20px; border-radius: 10px; margin-top: 30px; }
        input { padding: 8px; margin: 5px; border-radius: 5px; border: none; width: 180px; }
        button { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <h1>👥 Customers</h1>
    <a href="/dashboard">← Back</a>

    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Phone</th><th>Email</th>
        </tr>
        {% for c in customers %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.email }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="form-box">
        <h3>Add New Customer</h3>
        <form action="/add_customer/{{ franchise_id }}" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="text" name="phone" placeholder="Phone" required>
            <input type="email" name="email" placeholder="Email" required>
            <br><br>
            <button type="submit">Add Customer</button>
        </form>
    </div>
</body>
</html>
